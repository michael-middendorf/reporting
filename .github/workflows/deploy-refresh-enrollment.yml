name: Deploy Enrollment Refresh

on:
  push:
    branches: ["main"]
    paths:
      - "services/refresh/enrollment_pipeline/**"
      - ".github/workflows/deploy-refresh-enrollment.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install boto3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}
      - name: Deploy enrollment pipeline Lambda
        working-directory: services/refresh/enrollment_pipeline
        run: python deploy.py
