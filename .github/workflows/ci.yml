name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SHARP_VERSION: "0.35.3"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix apps/web-next
          "$HOME/.local/bin/uv" sync --all-packages

      - name: Validate web application and production bundle
        working-directory: apps/web-next
        run: |
          npm audit --omit=dev
          npm run lint
          npx --yes @opennextjs/aws@4.1.0 build
          test "$(node -p "require('./.open-next/image-optimization-function/node_modules/sharp/package.json').version")" = "0.35.3"
          test -d .open-next/image-optimization-function/node_modules/@img/sharp-linux-arm64
          test -d .open-next/image-optimization-function/node_modules/@img/sharp-libvips-linux-arm64
