name: Deploy API

on:
  push:
    branches: ["main"]
    paths:
      - "services/api/**"
      - "infra/deploy_api.py"
      - "infra/bootstrap_aws.py"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: python -m pip install boto3 -r services/api/requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}

      - name: Deploy API Lambda
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
          API_FUNCTION_NAME: ${{ vars.API_FUNCTION_NAME || 'amu-reporting-api' }}
          DATA_BUCKET: ${{ vars.DATA_BUCKET || 'amu-reporting-data-us-east-2' }}
        run: python infra/deploy_api.py
