name: Deploy ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Select deployment scope
        id: scope
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: python3 scripts/reporting-deploy-scope.py

      - name: Test web deployment boundaries
        run: python3 -m unittest discover -s scripts -p 'test_reporting_*.py'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install JS deps
        if: steps.scope.outputs.scope == 'full'
        run: |
          npm ci
          npm ci --prefix apps/web-next
          npm ci --prefix infra

      # SST builds the Python publisher/report Lambdas with uv (python: { uv: true }).
      # uv is not on the runner by default, so the sst deploy step below fails every
      # Python package build ("uv build failed") without this.
      - name: Install uv (for SST Python function builds)
        if: steps.scope.outputs.scope == 'full'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Type-check infrastructure
        if: steps.scope.outputs.scope == 'full'
        run: npm run build --prefix infra

      - name: Synthesize infrastructure
        if: steps.scope.outputs.scope == 'full'
        run: timeout 5m npm run synth --prefix infra -- --strict

      - name: Deploy ECS
        if: steps.scope.outputs.scope == 'full'
        working-directory: infra
        # Dockerfile.web performs the production Next.js build as part of the
        # CDK image asset; do not build it a second time in the runner.
        run: npx cdk deploy AmuReportingEcs --require-approval never

      - name: Deploy only Reporting web
        if: steps.scope.outputs.scope == 'web'
        run: python3 scripts/deploy-reporting-web.py --sha "$GITHUB_SHA" --execute

      - name: Deploy SST runtime (publishers)
        if: github.event_name == 'push' && steps.scope.outputs.scope == 'full'
        # The publisher crons (Annunciation, Enrollment, Housing, Virtuous)
        # and the on-demand report Lambdas (Institute/MAS/Alumni) live in the
        # SST stack, separate from the ECS web app above.
        # Do not add sst.aws.Nextjs Web; the public site is ECS.
        # Deploy them here so publisher/handler changes actually ship on merge
        # to main. This runs as the CI deploy role (secrets.AWS_DEPLOY_ROLE_ARN),
        # which -- unlike a personal PlatformEngineer user -- is not blocked by
        # the IAM guardrails (iam:*RolePolicy) that an sst deploy performs.
        run: npx sst deploy --stage production
