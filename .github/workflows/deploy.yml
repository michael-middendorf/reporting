name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install JS deps
        run: |
          npm ci
          npm ci --prefix apps/web-next

      - name: Sync Python workspace
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --all-packages

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      # SST secrets (AuthSecret, ResendApiKey, …) live in SST/SSM — not GitHub Secrets.
      # Runtime S3 access is IAM on the Next.js Lambda (sst.config permissions), not CI keys.
      - name: Deploy
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          npx sst deploy --stage production
