name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install JS deps
        run: |
          npm ci
          npm ci --prefix apps/web-next

      - name: Sync Python workspace
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --all-packages

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      # SST secrets (AuthSecret, ResendApiKey, …) live in SST/SSM — not GitHub Secrets.
      # Runtime S3 access is IAM on the Next.js Lambda (sst.config permissions), not CI keys.
      - name: Deploy
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          npx sst deploy --stage production
