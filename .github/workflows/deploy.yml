name: Deploy ECS

on:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install JS deps
        run: |
          npm ci
          npm ci --prefix apps/web-next
          npm ci --prefix infra

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Build and synthesize
        run: |
          npm run build --prefix apps/web-next
          npm run build --prefix infra
          npm run synth --prefix infra -- --strict

      - name: Deploy ECS
        run: npx --prefix infra cdk deploy AmuReportingEcs --require-approval never
